[project]
name = "nucmed"
version = "0.1.0"
description = "End-to-end nuclear medicine imaging pipeline: phantom -> SPECT forward model -> OSEM -> quantification -> dosimetry, validated against analytic and published references."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christian Moyota Bermeo", email = "c.moyota@uq.net.au" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nucmed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
